<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ========================================== -->
    <!-- TAG SEO UNTUK MEMPERTAHANKAN INDEX GOOGLE  -->
    <!-- ========================================== -->
    <title>WEBSITE LARISPAY PINDAH DOMAIN</title>
    <meta name="description" content="Pemberitahuan resmi: Larispay kini beroperasi di domain baru larispay.web.id. Pengalaman bertransaksi yang lebih eksklusif dan aman menanti Anda.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://larispay.web.id" />
    
    <!-- ========================================== -->
    <!-- META TAGS UNTUK MENCEGAH CACHE BROWSER     -->
    <!-- ========================================== -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <!-- Menggunakan font Google 'Montserrat' atau 'Inter' untuk kesan elegan -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Animasi Bola Emas Lompat -->
        <div class="bouncing-balls">
            <div class="ball"></div>
            <div class="ball"></div>
            <div class="ball"></div>
            <div class="ball"></div>
        </div>

        <!-- Judul -->
        <h1>WEBSITE LARISPAY PINDAH DOMAIN</h1>
        
        <!-- Pesan Pengalihan -->
        <p>Terima kasih telah mempercayai layanan kami. Ruang baru Anda sedang disiapkan dalam <span class="countdown-text" id="timer">5</span> detik.</p>
        
        <!-- Tombol Manual menggunakan fungsi JS agar cache tetap dibersihkan saat diklik -->
        <button onclick="clearCacheAndRedirect()" class="manual-link">Lanjutkan Akses</button>
    </div>

    <!-- Script JavaScript untuk Clear Cache, Countdown, dan Redirect -->
    <script src="script.js"></script>

</body>
</html>
